name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: COVERAGE=true bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Upload coverage
        if: matrix.ruby == '3.3'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/.resultset.json
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    name: Gem packaging
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build gem
        run: gem build ollama-client.gemspec

      - name: Install built gem into a clean environment
        run: |
          rm -rf /tmp/gem-install-check
          gem install ./ollama-client-*.gem --install-dir /tmp/gem-install-check
          echo "GEM_HOME=/tmp/gem-install-check" >> "$GITHUB_ENV"
          echo "GEM_PATH=/tmp/gem-install-check" >> "$GITHUB_ENV"

      - name: Verify the gem loads and exposes its public API
        run: |
          ruby -e '
            require "ollama_client"
            raise "VERSION missing" unless defined?(Ollama::VERSION)
            raise "Client missing" unless defined?(Ollama::Client)
            client = Ollama::Client.new
            %i[chat generate list_models pull embeddings web_search web_fetch].each do |m|
              raise "Client##{m} missing from public API" unless client.respond_to?(m)
            end
            puts "OK: ollama-client #{Ollama::VERSION} loads and exposes its documented API"
          '

  conformance:
    # Last line of defense against wire-vs-docs drift: runs the project's own
    # live smoke harness (script/live_branch_smoke.rb) against a REAL Ollama
    # server installed on the runner. The unit suite stays WebMock-only
    # (CLAUDE.md: "never require live Ollama in tests") — this job is the
    # dedicated live layer. Optional capabilities (vision, tools, thinking)
    # SKIP with an explicit reason when no capable model is pulled.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/version > /dev/null 2>&1; then
              echo "Ollama is up"
              break
            fi
            sleep 1
          done
          curl -s http://localhost:11434/api/version || true

      - name: Pull conformance models
        run: |
          ollama pull qwen3:0.6b
          ollama pull nomic-embed-text:latest

      - name: Run live smoke conformance suite
        env:
          OLLAMA_BASE_URL: http://localhost:11434
          OLLAMA_MODEL: qwen3:0.6b
          OLLAMA_EMBED_MODEL: nomic-embed-text:latest
          OLLAMA_SMOKE_BACKTRACE: "1"
        run: bundle exec ruby script/live_branch_smoke.rb

  dependency-audit:
    runs-on: ubuntu-latest
    name: Dependency vulnerability audit
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install bundler-audit
        run: gem install bundler-audit -v '~> 0.9'

      - name: Audit Gemfile.lock for known CVEs
        run: bundle-audit check --update

  ci:
    name: CI gate
    if: always()
    needs: [test, build, dependency-audit, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required checks failed:"
            echo "  test: ${{ needs.test.result }}"
            echo "  build: ${{ needs.build.result }}"
            echo "  dependency-audit: ${{ needs.dependency-audit.result }}"
            echo "  conformance: ${{ needs.conformance.result }}"
            exit 1
          fi
          echo "All required checks passed."
